<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn For Free</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.1/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
</head>
<body>
<div id="topWrapper">
<div id="pullLoader">
    <svg viewBox="0 0 24 24" id="reloadIcon">
        <path d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107.75-6.93z"/>
    </svg>
</div>
<a id="fbIconBtn" href="http://www.facebook.com/LETUANJP" target="_blank">
    <i class="fab fa-facebook-f"></i>
</a>
<h1 onclick="reloadPage()">Learn For Free</h1>
    <div id="searchWrapper">
        <div id="hskButtons">
            <div class="hskRow">
                <button class="hskBtn hsk1">HSK 1</button>
                <button class="hskBtn hsk2">HSK 2</button>
                <button class="hskBtn hsk3">HSK 3</button>
                <button class="hskBtn hsk4">HSK 4</button>
                <button class="hskBtn hsk5">HSK 5</button>
                <button class="hskBtn hsk6">HSK 6</button>
            </div>
            <div class="hskRow">
                <button class="hskBtn hsk3_0">HSK 1 (3.0)</button>
                <button class="hskBtn hsk3_1">HSK 2 (3.0)</button>
                <button class="hskBtn hsk3_2">HSK 3 (3.0)</button>
                <button class="hskBtn hsk3_3">HSK 4 (3.0)</button>
                <button class="hskBtn hsk3_4">HSK 5 (3.0)</button>
            </div>
        </div>

        <div id="searchBox">
            <input id="inputText" placeholder="Chinese word...">
            <div class="buttonRow">
                <button class="findBtn" onclick="process()">Find</button>
                <label class="fileLabel" for="excelFile">Excel</label>
                <button class="clearBtn" onclick="clearAll()">Clear All</button>
            </div>
            <input type="file" id="excelFile" accept=".xlsx" onchange="importExcel()">
        </div>
    </div>
</div>

<div id="animationWrapper">
    <div id="animationArea"></div>
    <div id="controlButtons">
        <button id="speedBtn" onclick="toggleSpeed()">NORMAL SPEED</button>
        <button id="repeatBtn" onclick="repeatSentence()">Repeat</button>
        <button id="hideBtn" onclick="toggleAnimation()">Hide</button>
        <button id="backBtn"onclick="scrollToActiveRow()">Back</button>
    </div>
</div>

<div id="sentenceSection">
    <div class="tableWrapper">
        <div class="sentenceHeader">
            <div>STT</div>
            <div>Từ vựng</div>
            <div>Phiên âm từ</div>
            <div>Loại từ</div>
            <div>Nghĩa từ</div>
            <div>Ví dụ</div>
            <div>Pinyin câu</div>
            <div>Dịch</div>
            <div>Xóa</div>
        </div>
        <div id="sentenceList"></div>
    </div>
</div>
<div id="responsiveMessage" style="display: none; font-size: 24px; color: #ef4444; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10001; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5);">
    Please use a larger device for a better experience.
</div>
<div id="errorMessage" style="display: none; position: fixed; top: 20px; right: 20px; background: #ffcccc; color: #cc0000; padding: 10px; border-radius: 5px; z-index: 10000;"></div>
<button id="backToTop" onclick="scrollToTop()">↑</button>
<script src="script.js"></script>
</body>
</html>
