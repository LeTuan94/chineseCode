<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn For Free</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.1/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-D1QW2D5V6V"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-D1QW2D5V6V');
</script>
<body>
<div class="top-wrapper">
    <div class="pull-loader">
        <svg viewBox="0 0 24 24" class="reload-icon">
            <path d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107.75-6.93z"/>
        </svg>
    </div>
    <a class="fb-icon-btn" href="http://www.facebook.com/LETUANJP" target="_blank">
        <i class="fab fa-facebook-f"></i>
    </a>
    <h1 class="app-title">Learn For Free</h1>
    
    <div class="search-wrapper">
        <div class="hsk-container">
            <div class="swipe-hint hsk-hint">✨ Swipe to explore more ✨ <i class="fas fa-hand-point-right"></i></div>
            <div class="hsk-buttons">
                <div class="hskRow">
                    <button class="hskBtn hsk1" data-level="HSK 1">HSK 1</button>
                    <button class="hskBtn hsk2" data-level="HSK 2">HSK 2</button>
                    <button class="hskBtn hsk3" data-level="HSK 3">HSK 3</button>
                    <button class="hskBtn hsk4" data-level="HSK 4">HSK 4</button>
                    <button class="hskBtn hsk5" data-level="HSK 5">HSK 5</button>
                    <button class="hskBtn hsk6" data-level="HSK 6">HSK 6</button>
                </div>
                <div class="hskRow">
                    <button class="hskBtn hsk3_0" data-level="HSK 1 (3.0)">HSK 1 (3.0)</button>
                    <button class="hskBtn hsk3_1" data-level="HSK 2 (3.0)">HSK 2 (3.0)</button>
                    <button class="hskBtn hsk3_2" data-level="HSK 3 (3.0)">HSK 3 (3.0)</button>
                    <button class="hskBtn hsk3_3" data-level="HSK 4 (3.0)">HSK 4 (3.0)</button>
                    <button class="hskBtn hsk3_4" data-level="HSK 5 (3.0)">HSK 5 (3.0)</button>
                </div>
            </div>
        </div>

        <div class="search-box">
            <input class="input-text" placeholder="Chinese word...">
            <div class="buttonRow">
                <button class="findBtn">Find</button>
                <label class="fileLabel">
                    Excel
                    <input type="file" class="excel-file" accept=".xlsx" style="display: none;">
                </label>
                <button class="clearBtn">Clear All</button>
            </div>
        </div>
    </div>
</div>

<div class="animation-wrapper">
    <div class="animation-area"></div>
    <div class="control-buttons">
        <button class="speed-btn">NORMAL SPEED</button>
        <button class="repeat-btn">Repeat</button>
        <button class="hide-btn">Hide</button>
        <button class="back-btn">Back</button>
    </div>
</div>

<div class="sentence-section">
    <div class="swipe-hint table-hint">✨ Swipe to explore more columns ✨ <i class="fas fa-hand-point-right"></i></div>
    
    <div class="tableWrapper">
        <div class="sentenceHeader">
            <div>STT</div>
            <div>Từ vựng</div>
            <div>Phiên âm từ</div>
            <div>Loại từ</div>
            <div>Nghĩa từ</div>
            <div>Ví dụ</div>
            <div>Pinyin câu</div>
            <div>Dịch</div>
            <div>Xóa</div>
        </div>
        <div class="sentence-list"></div>
    </div>
</div>

<div class="responsive-message">
    Please use a larger device for a better experience.
</div>
<div class="error-message"></div>
<button class="back-to-top">↑</button>
<script src="script.js"></script>
</body>
</html>
